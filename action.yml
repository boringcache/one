name: 'BoringCache One'
description: 'Shared build cache for GitHub Actions, Docker builds, and native build tools.'
author: 'BoringCache'
inputs:
  cli-version:
    description: 'Version of BoringCache CLI to install (e.g., v1.0.1). Set to "runner" to use whichever version the runner image preinstalled, which fails when it has none. Set to "skip" to disable automatic CLI setup.'
    default: 'v1.32.0'
    required: false
  cli-platform:
    description: 'Optional canonical CLI target override for advanced diagnostics: linux-amd64, linux-arm64, linux-musl-amd64, linux-musl-arm64, macos-universal, windows-amd64, or windows-arm64.'
    required: false
  mode:
    description: 'Use artifact to push or pull immutable outputs, archive for portable directory caches, gha for direct Actions-compatible clients, or the adapter matching the CLI command: docker, buildkit, bazel, cargo, ccache, go, gradle, maven, nix, nx, sccache, turbo, or xcode. A gha setup step does not redirect later provider actions on GitHub-hosted runners.'
    default: 'archive'
    required: false
  working-directory:
    description: 'Project root used for the committed BoringCache plan and relative cache paths.'
    default: '.'
    required: false
  trust-policy:
    description: 'Cache lifecycle: auto restores on pull requests and publishes on trusted events; restore never writes; stage creates an immutable candidate without moving the published tag; publish updates the published tag. Token capability remains authoritative.'
    default: 'auto'
    required: false
  diagnostics:
    description: 'Action-level diagnostics: auto follows ACTIONS_STEP_DEBUG, off disables grouped diagnostics, summary emits grouped state, and verbose also tails proxy logs.'
    default: 'auto'
    required: false
  proxy-port:
    description: 'Runner-local cache port from 1 to 65535. Empty lets the CLI prefer 22243 and fall back to a free port on conflict. Set only for process coordination; an occupied explicit port fails the step.'
    default: ''
    required: false
  cache-profiles:
    description: 'Repo cache profile names from .boringcache.toml or boringcache.toml (comma-separated or newline-separated). Required for archive mode.'
    required: false
  gradle-home:
    description: 'Gradle user home for mode: gradle, exported as GRADLE_USER_HOME for later steps. Relative paths use working-directory. Omitted uses the CLI plan, including repo configuration and GRADLE_USER_HOME.'
    required: false
  save:
    description: 'Post-step publication policy: on-success publishes when the job is still passing, always publishes the state the job reached even after a failed step, and never restores without publishing. Defaults to on-success.'
    default: 'on-success'
    required: false
  save-always:
    description: 'Compatibility alias for save: always. Run the post step to save the cache even if a later workflow step fails. It does not save after an embedded synchronous CLI command fails. Supports the same true spellings as GitHub boolean inputs.'
    default: 'false'
    required: false
  # CLI flags (passed directly to boringcache CLI)
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found (CLI --fail-on-cache-miss flag)'
    default: 'false'
    required: false
  fail-on-cache-error:
    description: 'Fail the workflow when cache restore, save, or proxy work fails. Defaults to false so a successful build remains successful; GitHub continue-on-error may still soften an explicitly strict step.'
    default: 'false'
    required: false
  lookup-only:
    description: 'Check if a cache entry exists without downloading (CLI --lookup-only flag)'
    default: 'false'
    required: false
  artifact-command:
    description: 'Artifact CLI operation: push uploads now; pull downloads and verifies now. Requires mode: artifact.'
    required: false
  artifact-path:
    description: 'Push: files, directories, or portable globs, one per line. Pull: one exact destination file or directory; omitted uses the CLI default. Relative to working-directory.'
    required: false
  artifact-name:
    description: 'Push: optional artifact label. Pull: exact name in this workflow run and attempt; ambiguous names fail. Use either artifact-name or artifact-id for pull.'
    required: false
  artifact-id:
    description: 'Immutable art_... ID to pull, including across jobs or runs with access to the workspace.'
    required: false
  artifact-workspace:
    description: 'Artifact workspace (namespace/workspace). Omitted uses normal CLI workspace resolution.'
    required: false
  artifact-retention-days:
    description: 'Push only: retention from 1 to 400 days, subject to workspace policy. Omitted uses the workspace default.'
    required: false
  artifact-include-hidden:
    description: 'Push only: include dot-prefixed files and directories. Symlinks are not followed.'
    default: 'false'
    required: false
outputs:
  artifact-id:
    description: 'Immutable BoringCache artifact ID returned after a successful push or pull.'
  artifact-digest:
    description: 'Content SHA-256 from the completed Artifact receipt.'
  artifact-download-path:
    description: 'Absolute destination after a successful artifact pull.'
  cache-hit:
    description: 'Whether an action-level restore or preflight found reusable cache. Empty means this setup step did not measure reuse; synchronous CLI modes and GHA report their outcome from the wrapped workload instead.'
  evidence-path:
    description: 'Path to the local boringcache/one JSON evidence file with restore and post-step state'
  cache-candidates:
    description: 'Exact staged candidate IDs created by this Action invocation, newline-separated. Carry them to an explicit CLI restore or promotion.'
  cache-candidate-digests:
    description: 'Exact manifest-root digests for candidates staged by this Action invocation, newline-separated.'
  restore-duration-seconds:
    description: 'mode: cargo. Seconds the restore phase took, measured by the CLI.'
  restore-transferred-bytes:
    description: 'mode: cargo. Bytes the restore phase transferred for all cache entries.'
  publish-duration-seconds:
    description: 'mode: cargo. Seconds the post-step publish phase took, measured by the CLI.'
  publish-transferred-bytes:
    description: 'mode: cargo. Bytes the publish phase uploaded. Zero when nothing changed.'
  publish-logical-bytes:
    description: 'mode: cargo. Uncompressed size the publish phase captured.'
  snapshot-duration-seconds:
    description: 'mode: cargo. Seconds the publish phase spent snapshotting and indexing before transfer.'
  proxy-port:
    description: 'Resolved runner-local port for a proxy that remains available to later workflow steps'
runs:
  using: 'node24'
  main: 'dist/restore/index.js'
  post: 'dist/save/index.js'
  post-if: "success() || env.BORINGCACHE_SAVE_ALWAYS == 'true'"
branding:
  icon: 'layers'
  color: 'blue'
