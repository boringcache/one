name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate distribution shape
        run: |
          test -f action.yml
          test -f README.md
          test -f LICENSE
          test -s dist/restore/index.js
          test -s dist/save/index.js
          test -s dist/utils.js

          for source_path in docs examples scripts lib tests package.json package-lock.json tsconfig.json jest.config.js node_modules; do
            if [ -e "$source_path" ]; then
              echo "$source_path belongs in the private monorepo gha source, not the public distribution repo." >&2
              exit 1
            fi
          done

      - name: Validate bundled JavaScript
        run: find dist -name '*.js' -print0 | xargs -0 -n1 node --check
