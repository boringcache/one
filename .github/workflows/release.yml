name: Release Action

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: one-release-${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release Action
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}

    steps:
      - name: Determine release tag
        id: release_meta
        run: |
          tag_input="${{ github.event.inputs.tag }}"
          ref="${GITHUB_REF:-}"

          if [ -n "$tag_input" ]; then
            tag="$tag_input"
          elif [ "${ref#refs/tags/}" != "$ref" ]; then
            tag="${ref#refs/tags/}"
          else
            echo "This workflow must be triggered from a tag or provided a tag input." >&2
            exit 1
          fi

          echo "Using release tag: $tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage release validator
        run: install -m 0755 .github/scripts/validate-distribution.sh "$RUNNER_TEMP/validate-distribution.sh"

      - name: Verify signed release tag
        run: |
          git checkout --detach "$RELEASE_TAG"

          cat > "$RUNNER_TEMP/allowed_signers" <<'EOF'
          gaurav@gauravtiwari.co.uk ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILVC6w5HTvW0TZwuN0/J3axNnAfNclejNgpCWs0b2KAM
          gaurav@gauravtiwari.co.uk ssh-rsa 
          release@boringcache.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA9aJJNs2BJ13PLtEY3n/nm43fyjYIlXzPzoTTmGekOO release@boringcache.com
          EOF

          git config gpg.format ssh
          git config gpg.ssh.program ssh-keygen
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git tag -v "$RELEASE_TAG"

          tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_target" != "$head_commit" ]; then
            echo "Release tag $RELEASE_TAG points at $tag_target, but checkout is $head_commit" >&2
            exit 1
          fi

      - name: Validate distribution bundle
        run: |
          "$RUNNER_TEMP/validate-distribution.sh" "$RELEASE_TAG"

      - name: Create package archive
        run: |
          mkdir -p release-package

          cp -r dist/ release-package/
          cp action.yml release-package/
          cp README.md release-package/
          cp LICENSE release-package/

          echo "ACTION_VERSION=${RELEASE_TAG}" > release-package/VERSION

          cd release-package
          tar -czf ../release-package.tar.gz .
          cd ..

      - name: Generate package provenance attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-package.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "BoringCache One ${{ env.RELEASE_TAG }}"
          body: |
            **One action for the BoringCache product suite.**

            One GitHub Action that replays the CLI-owned repo plan for archive,
            Docker, BuildKit, Bazel, ccache, Go, Gradle, Maven, Nx, sccache,
            Turbo, and Xcode caching.

            Includes the bundled release artifact for this tag.

            See [README](https://github.com/boringcache/one) for usage.
          draft: false
          prerelease: false
          overwrite_files: true
          files: ./release-package.tar.gz

      - name: Verify package provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release-package.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --deny-self-hosted-runners
