version: 2
updates:
  - package-ecosystem: npm
    directory: "/examples/nextjs_app"
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      nextjs-security:
        applies-to: security-updates
        patterns:
          - "*"
      nextjs-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: "/examples/rails_app"
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      rails-security:
        applies-to: security-updates
        patterns:
          - "*"
      rails-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/examples/nextjs_app"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      nextjs-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/examples/rails_app"
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      rails-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
